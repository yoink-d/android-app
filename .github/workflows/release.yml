name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare release signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.YOINKD_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          value = os.environ.get("SIGNING_KEYSTORE_BASE64")
          if not value:
              raise SystemExit("Configure YOINKD_KEYSTORE_BASE64 and the three release signing secrets.")
          key = Path(os.environ["RUNNER_TEMP"]) / "yoinkd-release.jks"
          key.write_bytes(base64.b64decode(value, validate=True))
          key.chmod(0o600)
          PY
      - name: Build and validate signed architecture releases
        env:
          YOINKD_KEYSTORE: ${{ runner.temp }}/yoinkd-release.jks
          YOINKD_STORE_PASSWORD: ${{ secrets.YOINKD_STORE_PASSWORD }}
          YOINKD_KEY_ALIAS: ${{ secrets.YOINKD_KEY_ALIAS }}
          YOINKD_KEY_PASSWORD: ${{ secrets.YOINKD_KEY_PASSWORD }}
          YOINKD_ALLOW_DEVELOPMENT_ALPHA: ${{ vars.YOINKD_ALLOW_DEVELOPMENT_ALPHA }}
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          release_code="$((1000 + GITHUB_RUN_NUMBER))"
          ./scripts/check.sh -PyoinkdVersionName="$release_version" -PyoinkdVersionCode="$release_code" \
            -PruntimeReleaseTag="$GITHUB_REF_NAME"
          signing_args=()
          if [[ "$YOINKD_ALLOW_DEVELOPMENT_ALPHA" == "true" && "$release_version" == *-alpha.* ]]; then
            signing_args+=(--allow-development-key-for-alpha)
          fi
          python3 scripts/package-release.py --tag "$GITHUB_REF_NAME" --output "build/releases/$GITHUB_REF_NAME" "${signing_args[@]}"
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease_args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "yoink'd ${GITHUB_REF_NAME#v}" \
            --notes-file "build/releases/$GITHUB_REF_NAME/release-notes.md" \
            "${prerelease_args[@]}" "build/releases/$GITHUB_REF_NAME/"*
          gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Remove temporary signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/yoinkd-release.jks"
